<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Happy Birthday Papa</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins;
}

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:black;
color:white;
overflow:hidden;
}

/* GALAXY BACKGROUND */

body::before{
content:"";
position:absolute;
width:300%;
height:300%;
background:
radial-gradient(circle at 20% 20%,#1a2a6c,#000000),
radial-gradient(circle at 80% 80%,#16222a,#000000);
animation:space 40s linear infinite;
z-index:-2;
}

@keyframes space{
0%{transform:rotate(0)}
100%{transform:rotate(360deg)}
}

/* FLOATING STARS */

.star{
position:absolute;
width:2px;
height:2px;
background:white;
opacity:.6;
animation:twinkle 4s infinite;
}

@keyframes twinkle{
0%,100%{opacity:.2}
50%{opacity:1}
}

/* GLASS UI */

.glass{
backdrop-filter:blur(25px);
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.2);
box-shadow:0 0 40px cyan;
border-radius:25px;
padding:40px;
text-align:center;
width:90%;
max-width:600px;
}

/* HOLOGRAM TEXT */

.holo{
font-size:32px;
text-shadow:
0 0 10px cyan,
0 0 20px cyan,
0 0 40px cyan,
0 0 80px cyan;
}

/* CAKE */

.cake{
margin-top:30px;
cursor:pointer;
}

.layer{
width:220px;
height:40px;
margin:auto;
margin-top:5px;
border-radius:10px;
background:linear-gradient(45deg,#ff6a00,#ee0979);
box-shadow:0 0 25px #ff4da6;
}

.candle{
width:10px;
height:30px;
background:white;
margin:auto;
position:relative;
}

.flame{
width:10px;
height:15px;
background:orange;
border-radius:50%;
position:absolute;
top:-15px;
animation:flicker .3s infinite;
}

@keyframes flicker{
0%{transform:scale(1)}
50%{transform:scale(1.3)}
100%{transform:scale(1)}
}

/* 3D PHOTO GALLERY */

.gallery{
display:none;
margin-top:40px;
perspective:1000px;
}

.carousel{
width:250px;
height:250px;
margin:auto;
transform-style:preserve-3d;
animation:spin 20s linear infinite;
}

.carousel img{
position:absolute;
width:220px;
height:220px;
border-radius:15px;
box-shadow:0 0 30px cyan;
}

.carousel img:nth-child(1){transform:rotateY(0deg) translateZ(350px);}
.carousel img:nth-child(2){transform:rotateY(60deg) translateZ(350px);}
.carousel img:nth-child(3){transform:rotateY(120deg) translateZ(350px);}
.carousel img:nth-child(4){transform:rotateY(180deg) translateZ(350px);}
.carousel img:nth-child(5){transform:rotateY(240deg) translateZ(350px);}
.carousel img:nth-child(6){transform:rotateY(300deg) translateZ(350px);}

@keyframes spin{
0%{transform:rotateY(0)}
100%{transform:rotateY(360deg)}
}

/* BADGE */

.badge{
margin-top:20px;
font-size:20px;
color:gold;
text-shadow:0 0 20px gold;
}

#main{display:none}

input,button{
padding:12px;
border:none;
border-radius:10px;
margin-top:10px;
}

button{
background:cyan;
font-weight:bold;
cursor:pointer;
}

canvas{
position:absolute;
top:0;
left:0;
pointer-events:none;
}

</style>
</head>

<body>

<audio autoplay loop>
<source src="https://cdn.pixabay.com/audio/2022/03/15/audio_7b3f0b76b2.mp3">
</audio>

<canvas id="fireworks"></canvas>

<div class="glass" id="login">

<h2>🎁 Birthday Portal</h2>

<input type="password" id="pass" placeholder="Enter Password">

<br>

<button onclick="enter()">Unlock</button>

</div>

<div class="glass" id="main">

<h1 class="holo">🎉 Happy Birthday Papa 🎉</h1>

<p>21 March 1981 ko duniya ko ek amazing insaan mila ❤️</p>

<div class="badge">🏆 BEST PAPA EVER</div>

<div class="cake" onclick="cutCake()">

<div class="candle"><div class="flame"></div></div>

<div class="layer"></div>
<div class="layer"></div>
<div class="layer"></div>

<p>Click Cake to Cut 🎂</p>

</div>

<div class="gallery" id="gallery">

<div class="carousel">

<img src="https://picsum.photos/200?1">
<img src="https://picsum.photos/200?2">
<img src="https://picsum.photos/200?3">
<img src="https://picsum.photos/200?4">
<img src="https://picsum.photos/200?5">
<img src="https://picsum.photos/200?6">

</div>

</div>

</div>

<script>

/* STARS */

for(let i=0;i<120;i++){

let s=document.createElement("div");
s.className="star";
s.style.left=Math.random()*100+"%";
s.style.top=Math.random()*100+"%";
document.body.appendChild(s);

}

/* PASSWORD */

function enter(){

if(document.getElementById("pass").value==="LUCKY ROY"){

document.getElementById("login").style.display="none";
document.getElementById("main").style.display="block";

}

}

/* CAKE */

function cutCake(){

document.querySelector(".cake").innerHTML="🎂 Cake Cut! Happy Birthday Papa ❤️";

document.getElementById("gallery").style.display="block";

let msg=new SpeechSynthesisUtterance(
"Happy Birthday Papa. You are the best father in the world."
);

speechSynthesis.speak(msg);

startFireworks();

}

/* FIREWORKS */

let canvas=document.getElementById("fireworks");
let ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

function startFireworks(){

setInterval(()=>{

let x=Math.random()*canvas.width;
let y=Math.random()*canvas.height/2;

for(let i=0;i<80;i++){

ctx.fillStyle="hsl("+Math.random()*360+",100%,50%)";

ctx.beginPath();
ctx.arc(x+Math.random()*120-60,y+Math.random()*120-60,3,0,Math.PI*2);
ctx.fill();

}

},300)

}

</script>

</body>
</html>
