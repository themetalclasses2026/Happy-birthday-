<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Happy Birthday Papa</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins;
}

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#000;
color:white;
overflow:hidden;
}

/* background */

body::before{
content:"";
position:absolute;
width:200%;
height:200%;
background:radial-gradient(circle,#0f2027,#000);
animation:rotate 80s linear infinite;
z-index:-2;
}

@keyframes rotate{
0%{transform:rotate(0)}
100%{transform:rotate(360deg)}
}

/* stars */

.star{
position:absolute;
width:2px;
height:2px;
background:white;
opacity:.7;
animation:twinkle 3s infinite alternate;
}

@keyframes twinkle{
from{opacity:.2}
to{opacity:1}
}

/* glass card */

.card{
backdrop-filter:blur(20px);
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.2);
box-shadow:0 0 30px cyan;
border-radius:20px;
padding:35px;
text-align:center;
width:90%;
max-width:600px;
}

/* suitcase */

.suitcase{
font-size:70px;
animation:float 3s ease-in-out infinite;
cursor:pointer;
}

@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-10px)}
}

/* title */

.title{
font-size:32px;
text-shadow:0 0 15px cyan,0 0 30px cyan;
}

/* cake */

.cake{
margin-top:30px;
cursor:pointer;
}

.layer{
width:200px;
height:35px;
margin:auto;
margin-top:6px;
border-radius:10px;
background:linear-gradient(45deg,#ff6a00,#ff0080);
box-shadow:0 0 15px #ff4da6;
}

.candle{
width:8px;
height:28px;
background:white;
margin:auto;
position:relative;
}

.flame{
width:10px;
height:14px;
background:orange;
border-radius:50%;
position:absolute;
top:-14px;
animation:flicker .4s infinite;
}

@keyframes flicker{
0%{transform:scale(1)}
50%{transform:scale(1.2)}
100%{transform:scale(1)}
}

/* gallery */

.gallery{
display:none;
margin-top:30px;
perspective:900px;
}

.carousel{
width:220px;
height:220px;
margin:auto;
transform-style:preserve-3d;
animation:spin 18s linear infinite;
}

.carousel img{
position:absolute;
width:200px;
height:200px;
border-radius:12px;
box-shadow:0 0 20px cyan;
}

.carousel img:nth-child(1){transform:rotateY(0deg) translateZ(300px);}
.carousel img:nth-child(2){transform:rotateY(60deg) translateZ(300px);}
.carousel img:nth-child(3){transform:rotateY(120deg) translateZ(300px);}
.carousel img:nth-child(4){transform:rotateY(180deg) translateZ(300px);}
.carousel img:nth-child(5){transform:rotateY(240deg) translateZ(300px);}
.carousel img:nth-child(6){transform:rotateY(300deg) translateZ(300px);}

@keyframes spin{
0%{transform:rotateY(0)}
100%{transform:rotateY(360deg)}
}

canvas{
position:absolute;
top:0;
left:0;
pointer-events:none;
}

#main{display:none}

input,button{
padding:10px;
border:none;
border-radius:10px;
margin-top:10px;
}

button{
background:cyan;
cursor:pointer;
}

</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="card">

<div id="lock">

<h2>💼 Papa's Office Briefcase</h2>

<div class="suitcase">💼</div>

<p>Enter Password</p>

<input type="password" id="pass">

<br>

<button onclick="unlock()">Unlock</button>

</div>

<div id="main">

<h1 class="title">🎉 Happy Birthday Papa 🎉</h1>

<p>21 March 1981 ko ek amazing insaan paida hua ❤️</p>

<div class="cake" onclick="cutCake()">

<div class="candle"><div class="flame"></div></div>

<div class="layer"></div>
<div class="layer"></div>
<div class="layer"></div>

<p>Click cake to cut 🎂</p>

</div>

<div class="gallery" id="gallery">

<div class="carousel">

<img src="https://ratty-coral-uqatvqbdqy.edgeone.app">
<img src="https://prepared-salmon-jdjb9876vg.edgeone.app">
<img src="https://neutral-bronze-qvpbyv8mr8.edgeone.app">
<img src="https://delicious-amaranth-eohoonrge9.edgeone.app">
<img src="https://solar-brown-hog3tkywbh.edgeone.app">
<img src="https://negative-lavender-2oe9mzm8u8.edgeone.app">

</div>

</div>

</div>

</div>

<script>

/* stars */

for(let i=0;i<70;i++){
let s=document.createElement("div");
s.className="star";
s.style.left=Math.random()*100+"%";
s.style.top=Math.random()*100+"%";
document.body.appendChild(s);
}

/* unlock */

function unlock(){

if(document.getElementById("pass").value==="2103"){

document.getElementById("lock").style.display="none";
document.getElementById("main").style.display="block";

}

}

/* cake */

function cutCake(){

document.querySelector(".cake").innerHTML="🎂 Cake Cut! Happy Birthday Papa ❤️";

document.getElementById("gallery").style.display="block";

speechSynthesis.speak(
new SpeechSynthesisUtterance("Happy Birthday Papa")
);

launchFireworks();

}

/* fireworks */

const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

let particles=[];

function launchFireworks(){

for(let i=0;i<100;i++){

particles.push({
x:innerWidth/2,
y:innerHeight/3,
vx:(Math.random()-0.5)*5,
vy:(Math.random()-0.5)*5,
life:100
})

}

}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);

particles.forEach(p=>{

p.x+=p.vx;
p.y+=p.vy;
p.life--;

ctx.fillStyle="hsl("+Math.random()*360+",100%,50%)";
ctx.fillRect(p.x,p.y,3,3);

});

particles=particles.filter(p=>p.life>0);

requestAnimationFrame(animate);

}

animate();

</script>

</body>
</html>
