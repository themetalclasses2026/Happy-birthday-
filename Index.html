<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Happy Birthday Papa</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins;
}

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:black;
color:white;
overflow:hidden;
}

/* galaxy background */

body::before{
content:"";
position:absolute;
width:200%;
height:200%;
background:radial-gradient(circle,#111,#000);
animation:rotate 80s linear infinite;
z-index:-2;
}

@keyframes rotate{
0%{transform:rotate(0)}
100%{transform:rotate(360deg)}
}

/* glass card */

.card{
backdrop-filter:blur(20px);
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.2);
border-radius:20px;
padding:40px;
width:90%;
max-width:650px;
text-align:center;
box-shadow:0 0 40px cyan;
}

/* marvel style intro */

.intro{
font-size:38px;
font-weight:600;
letter-spacing:3px;
text-transform:uppercase;
animation:intro 3s ease forwards;
}

@keyframes intro{

0%{
transform:scale(0.2);
opacity:0;
text-shadow:none;
}

100%{
transform:scale(1);
opacity:1;
text-shadow:0 0 20px red,0 0 40px red;
}

}

/* suitcase */

.suitcase{
font-size:70px;
animation:float 3s ease-in-out infinite;
}

@keyframes float{

0%,100%{transform:translateY(0)}
50%{transform:translateY(-10px)}

}

/* cake */

.cake{
margin-top:30px;
cursor:pointer;
}

.layer{
width:220px;
height:40px;
margin:auto;
border-radius:10px;
background:#ff69b4;
margin-top:6px;
box-shadow:0 0 10px pink;
}

.icing{
width:230px;
height:10px;
background:white;
border-radius:10px;
margin:auto;
margin-top:-6px;
}

.candle{
width:10px;
height:30px;
background:white;
margin:auto;
position:relative;
}

.flame{
width:12px;
height:16px;
background:orange;
border-radius:50%;
position:absolute;
top:-16px;
animation:flicker .4s infinite;
}

@keyframes flicker{
0%{transform:scale(1)}
50%{transform:scale(1.2)}
100%{transform:scale(1)}
}

/* gallery */

.gallery{
display:none;
margin-top:30px;
perspective:900px;
}

.carousel{
width:220px;
height:220px;
margin:auto;
transform-style:preserve-3d;
animation:spin 20s linear infinite;
}

.carousel img{
position:absolute;
width:200px;
height:200px;
border-radius:12px;
box-shadow:0 0 20px cyan;
object-fit:cover;
}

.carousel img:nth-child(1){transform:rotateY(0deg) translateZ(300px);}
.carousel img:nth-child(2){transform:rotateY(60deg) translateZ(300px);}
.carousel img:nth-child(3){transform:rotateY(120deg) translateZ(300px);}
.carousel img:nth-child(4){transform:rotateY(180deg) translateZ(300px);}
.carousel img:nth-child(5){transform:rotateY(240deg) translateZ(300px);}
.carousel img:nth-child(6){transform:rotateY(300deg) translateZ(300px);}

@keyframes spin{
0%{transform:rotateY(0)}
100%{transform:rotateY(360deg)}
}

canvas{
position:absolute;
top:0;
left:0;
pointer-events:none;
}

#main{display:none}

input,button{
padding:10px;
border:none;
border-radius:10px;
margin-top:10px;
}

button{
background:cyan;
cursor:pointer;
}

</style>
</head>

<body>

<canvas id="fx"></canvas>

<div class="card">

<div id="lock">

<div class="intro">Birthday Vault</div>

<br>

<div class="suitcase">💼</div>

<p>Enter Password</p>

<input type="password" id="pass">

<br>

<button onclick="unlock()">Unlock</button>

</div>

<div id="main">

<h1 class="intro">Happy Birthday Papa</h1>

<p>Born on 21 March 1981 ❤️</p>

<div class="cake" onclick="cutCake()">

<div class="candle"><div class="flame"></div></div>

<div class="icing"></div>
<div class="layer"></div>

<div class="icing"></div>
<div class="layer"></div>

<div class="icing"></div>
<div class="layer"></div>

<p>Click Cake 🎂</p>

</div>

<div class="gallery" id="gallery">

<div class="carousel">

<img src="https://ratty-coral-uqatvqbdqy.edgeone.app">
<img src="https://prepared-salmon-jdjb9876vg.edgeone.app">
<img src="https://neutral-bronze-qvpbyv8mr8.edgeone.app">
<img src="https://delicious-amaranth-eohoonrge9.edgeone.app">
<img src="https://solar-brown-hog3tkywbh.edgeone.app">
<img src="https://negative-lavender-2oe9mzm8u8.edgeone.app">

</div>

</div>

</div>

</div>

<script>

/* unlock */

function unlock(){

if(document.getElementById("pass").value==="2103"){

document.getElementById("lock").style.display="none";
document.getElementById("main").style.display="block";

}

}

/* male voice */

function speak(){

let msg=new SpeechSynthesisUtterance("Happy Birthday Papa");

let voices=speechSynthesis.getVoices();

for(let v of voices){

if(v.name.toLowerCase().includes("male") || v.name.toLowerCase().includes("david")){

msg.voice=v;
break;

}

}

speechSynthesis.speak(msg);

}

/* cake */

function cutCake(){

document.querySelector(".cake").innerHTML="🎂 Cake Cut! Happy Birthday Papa ❤️";

document.getElementById("gallery").style.display="block";

speak();

fireworks();

}

/* fireworks */

const canvas=document.getElementById("fx")
const ctx=canvas.getContext("2d")

canvas.width=innerWidth
canvas.height=innerHeight

let p=[]

function fireworks(){

for(let i=0;i<120;i++){

p.push({
x:innerWidth/2,
y:innerHeight/3,
vx:(Math.random()-0.5)*6,
vy:(Math.random()-0.5)*6,
life:100
})

}

}

function loop(){

ctx.clearRect(0,0,canvas.width,canvas.height)

p.forEach(a=>{

a.x+=a.vx
a.y+=a.vy
a.life--

ctx.fillStyle="hsl("+Math.random()*360+",100%,50%)"
ctx.fillRect(a.x,a.y,3,3)

})

p=p.filter(a=>a.life>0)

requestAnimationFrame(loop)

}

loop()

</script>

</body>
</html>
